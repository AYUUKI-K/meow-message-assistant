<header><small>MEOW MESSAGE ASSISTANT / ICON STUDIES</small><h1>选一只你的猫。</h1><p>6 款原生 SVG · 点选方案，右侧查看 40px 悬浮效果。支持日夜配色、侧边收纳与单个 SVG 下载。</p></header>
<main class="layout"><div class="gallery" id="gallery"></div><aside class="aside"><h2>放进侧栏，看看感觉</h2><p class="selected" id="selected"></p><div class="switch"><button id="light" aria-pressed="true">日间</button><button id="dark" aria-pressed="false">夜间</button></div><div class="phone" id="phone"><div class="bar">喵喵消息助手 / 侧栏示意</div><div class="article"><p>窗外的风掠过树梢，<br>一封新消息悄悄抵达。</p><p>猫猫守在屏幕边缘，<br>等你翻开下一页。</p><p>轻触侧边触控线收起，<br>再次轻触，就会探出头。</p></div><div class="rail"><button class="arrow" id="up" aria-label="本层顶部"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6M6 4h12"/></svg></button><button class="cat" id="cat" aria-label="打开楼层页"></button><button class="arrow" id="down" aria-label="本层底部"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6M6 20h12"/></svg></button></div><button class="handle" id="handle" aria-label="收起侧栏" aria-expanded="true"></button><div class="phone-panel" id="panel" hidden><button class="close" id="close" aria-label="关闭楼层页">×</button><b>喵喵消息助手</b><div class="emblem" id="emblem"></div><label for="floor">楼层</label><input id="floor" inputmode="numeric" placeholder="例如 112"><button class="demo-action" id="jump">跳转</button></div></div><div class="status" id="status" role="status"></div><button class="download" id="download">下载选中 SVG</button><p class="hint">猫猫打开楼层页，上下按钮竖向保留。此页为图标预览，点选不会修改助手的默认图标。</p></aside><footer>方案保存在 cat-icons.ts；v2.5.4 已选用 03 来信喵；其他方案保留供后续调整。</footer></main>

<script>
const options=JSON.parse(document.getElementById('icon-data').textContent);let selected=options.find(o=>o.id==='letter');const $=id=>document.getElementById(id);
$('gallery').innerHTML=options.map((o,i)=>`<button type="button" class="card" data-id="${o.id}" aria-pressed="false"><span class="card-title"><span class="number">0${i+1}</span>${o.name}</span><span class="subtitle">${o.subtitle}</span><span class="pair"><span class="tile day" data-label="DAY">${o.svg}</span><span class="tile night" data-label="NIGHT">${o.svg}</span></span><span class="sizes">${[24,40,56].map(s=>`<span class="size"><span style="display:block;width:${s}px;height:${s}px">${o.svg.replace('<svg ','<svg width="100%" height="100%" ')}</span><small>${s}px</small></span>`).join('')}</span></button>`).join('');
function select(o){selected=o;document.querySelectorAll('.card').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.id===o.id)));$('selected').textContent=`${String(options.indexOf(o)+1).padStart(2,'0')} / ${o.name}`;$('cat').innerHTML=$('emblem').innerHTML=o.svg;}
$('gallery').addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(card)select(options.find(o=>o.id===card.dataset.id));});
function theme(dark){$('phone').classList.toggle('dark',dark);$('light').setAttribute('aria-pressed',String(!dark));$('dark').setAttribute('aria-pressed',String(dark));}
$('light').onclick=()=>theme(false);$('dark').onclick=()=>theme(true);
$('handle').onclick=()=>{const folded=$('phone').classList.toggle('folded');$('handle').setAttribute('aria-expanded',String(!folded));$('handle').setAttribute('aria-label',folded?'展开侧栏':'收起侧栏');};
$('cat').onclick=()=>{$('panel').hidden=false;$('close').focus();};$('close').onclick=()=>{$('panel').hidden=true;$('cat').focus();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('panel').hidden)$('close').click();});
$('up').onclick=()=>{$('status').textContent='示意：回到本层顶部';};$('down').onclick=()=>{$('status').textContent='示意：回到本层底部';};$('jump').onclick=()=>{$('status').textContent='这是图标预览，实际跳转在助手里使用。';$('close').click();};
$('download').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([selected.svg],{type:'image/svg+xml;charset=utf-8'}));a.href=url;a.download=`喵喵-${selected.name}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};select(selected);
</script></html>
